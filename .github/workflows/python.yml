name: Karyo Resume Builder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff
        run: ruff check app tests run.py

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app run.py

      - name: Run unit tests
        env:
          OPENROUTER_MODEL: ci-test-model
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_API_KEY: dummy-key
        run: |
          pytest -v

  backend-docker:
    name: Backend Docker
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            --no-cache \
            -t resume-reviewer-backend \
            -f backend/Dockerfile \
            backend

      - name: Run container
        run: |
          docker run -d \
            --rm \
            --name resume-reviewer \
            -p 5000:5000 \
            -e OPENROUTER_MODEL=ci-test-model \
            -e OPENROUTER_BASE_URL=https://openrouter.ai/api/v1 \
            -e OPENROUTER_API_KEY=dummy-key \
            resume-reviewer-backend

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs resume-reviewer
          exit 1

      - name: Stop container
        if: always()
        run: docker stop resume-reviewer || true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build