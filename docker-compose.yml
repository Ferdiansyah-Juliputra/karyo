services:
  api:
    container_name: karyo-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    image: karyo-backend:latest

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      FLASK_DEBUG: "true"
    
    dns:
      - 8.8.8.8
      - 1.1.1.1

    volumes:
      - ./backend:/app

    command: python run.py

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  frontend:
    container_name: karyo-frontend

    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: karyo-frontend:latest

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      WATCHPACK_POLLING: "true"

    depends_on:
      - api

    command: npm run dev

    restart: unless-stopped

  redis:
    container_name: karyo-redis

    image: redis:7-alpine

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  postgres-test:
    container_name: karyo-postgres-test

    image: postgres:17-alpine

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: karyo_test

    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d karyo_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
    