<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Resume Reviewer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f8fb;
    color:#1f2937;
    max-width:820px;
    margin:50px auto;
    padding:20px;
}

/* ===========================
    Upload Card
=========================== */

.upload-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:20px;
    box-shadow:0 2px 8px rgba(15,23,42,.06);
    padding:30px;
    margin-bottom:36px;
}

.upload-header{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:30px;
}

.upload-icon{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#10a37f;
    color:white;
    display:grid;
    place-items:center;
    font-weight:bold;
    font-size:18px;
}

.upload-header h1{
    font-size:28px;
    margin-bottom:5px;
}

.upload-header p{
    color:#6b7280;
    font-size:14px;
}

/* ===========================
    Form
=========================== */

form{
    display:flex;
    flex-direction:column;
    gap:18px;
}

label{
    font-weight:600;
}

/* ===========================
    Dropzone
=========================== */

.drop-zone{
    border:2px dashed #cbd5e1;
    border-radius:16px;
    background:#fafafa;
    padding:45px 20px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
}

.drop-zone:hover{
    background:#ecfdf5;
    border-color:#10a37f;
}

.drop-zone.dragover{
    background:#ecfdf5;
    border-color:#10a37f;
    transform:scale(1.01);
}

.drop-zone input{
    display:none;
}

.drop-zone-icon{
    font-size:42px;
    margin-bottom:10px;
}

.drop-zone strong{
    display:block;
    font-size:17px;
    margin-bottom:8px;
}

.drop-zone span{
    color:#6b7280;
    font-size:14px;
}

.file-name{
    margin-top:15px;
    color:#10a37f;
    font-weight:bold;
}

/* ===========================
    Textarea
=========================== */

textarea{
    resize:vertical;
    min-height:180px;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    line-height:1.6;
}

textarea:focus{
    outline:none;
    border-color:#10a37f;
}

/* ===========================
    Button
=========================== */

button{
    border:none;
    background:#10a37f;
    color:white;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.2s;
}

button:hover{
    background:#0d8d6d;
}

/* ===========================
    Response
=========================== */

.response-section{
    margin-top:20px;
}

.response-heading{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
    font-size:18px;
}

.assistant-avatar{
    display:grid;
    width:28px;
    height:28px;
    place-items:center;
    color:#fff;
    background:#10a37f;
    border-radius:50%;
    font-size:13px;
    font-weight:700;
}

.response-content{
    margin:0;
    min-height:100px;
    padding:22px;
    color:#1f2937;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:4px 18px 18px 18px;
    box-shadow:0 2px 8px rgba(15,23,42,.06);
    line-height:1.65;
}

.response-empty{
    color:#6b7280;
    font-style:italic;
}

.response-content p{
    margin-bottom:14px;
}

.response-content ul{
    margin-bottom:18px;
    padding-left:22px;
}

.response-content li{
    margin-bottom:6px;
}

.response-content h3{
    margin:18px 0 8px;
}

.score{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:10px 15px;
    border-radius:12px;
    background:#ecfdf5;
    color:#065f46;
    margin-bottom:18px;
}

.score strong{
    font-size:24px;
}

</style>
</head>

<body>

<div class="upload-card">

    <div class="upload-header">

        <div class="upload-icon">
            AI
        </div>

        <div>
            <h1>AI Resume Reviewer</h1>
            <p>
                Upload your resume and compare it against the job description to
                receive ATS insights and improvement suggestions.
            </p>
        </div>

    </div>

    <form id="reviewForm">

        <label>Resume (PDF / DOCX)</label>

        <label class="drop-zone" id="dropZone">

            <input
                id="resumeInput"
                type="file"
                name="resume"
                accept=".pdf,.docx"
                required
            >

            <div class="drop-zone-icon">
                📄
            </div>

            <strong>
                Drag & Drop your resume here
            </strong>

            <span>
                or click to browse
            </span>

            <div
                class="file-name"
                id="fileName">
            </div>

        </label>

        <label>
            Job Requirement
        </label>

        <textarea
            name="requirement"
            placeholder="Paste the job description..."
            required
        ></textarea>

        <button type="submit">
            Review Resume
        </button>

    </form>

</div>

<section
    class="response-section"
    aria-live="polite">

    <h2 class="response-heading">

        <span class="assistant-avatar">
            AI
        </span>

        Review Result

    </h2>

    <div
        id="result"
        class="response-content response-empty">

        Your resume review will appear here.

    </div>

</section>

<script>

const form=document.getElementById("reviewForm");
const result=document.getElementById("result");

const dropZone=document.getElementById("dropZone");
const input=document.getElementById("resumeInput");
const fileName=document.getElementById("fileName");

/* ===========================
    File Upload
=========================== */

function updateFile(file){

    if(file){

        fileName.textContent="✔ "+file.name;

    }else{

        fileName.textContent="";

    }

}

input.addEventListener("change",()=>{

    updateFile(input.files[0]);

});

dropZone.addEventListener("dragover",(e)=>{

    e.preventDefault();

    dropZone.classList.add("dragover");

});

dropZone.addEventListener("dragleave",()=>{

    dropZone.classList.remove("dragover");

});

dropZone.addEventListener("drop",(e)=>{

    e.preventDefault();

    dropZone.classList.remove("dragover");

    const files=e.dataTransfer.files;

    if(files.length){

        input.files=files;

        updateFile(files[0]);

    }

});

/* ===========================
    Render Response
=========================== */

function addList(title,items){

    const heading=document.createElement("h3");
    heading.textContent=title;

    result.appendChild(heading);

    const list=document.createElement("ul");

    items.forEach(item=>{

        const li=document.createElement("li");
        li.textContent=item;

        list.appendChild(li);

    });

    result.appendChild(list);

}

function renderResponse(review){

    result.replaceChildren();

    const score=document.createElement("p");
    score.className="score";

    const value=document.createElement("strong");
    value.textContent=review.ats_score;

    score.append(
        value,
        document.createTextNode(" / 100 ATS Match")
    );

    result.appendChild(score);

    const summary=document.createElement("p");
    summary.textContent=review.summary;

    result.appendChild(summary);

    addList(
        "Strengths",
        review.strengths
    );

    addList(
        "Missing Skills",
        review.missing_skills
    );

    addList(
        "Recommendations",
        review.recommendations
    );

}

/* ===========================
    Submit
=========================== */

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const formData=new FormData(form);

    result.classList.remove("response-empty");
    result.textContent="Reviewing your resume...";

    try{

        const response=await fetch("/review",{

            method:"POST",

            body:formData

        });

        const data=await response.json();

        if(!response.ok||!data.success){

            throw new Error(
                data.message||
                "Review request failed."
            );

        }

        renderResponse(data.data);

    }catch(error){

        result.textContent=
            error.message||
            "Sorry, the review could not be completed.";

    }

});

</script>

</body>
</html>
